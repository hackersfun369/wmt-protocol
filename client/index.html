<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMTP Premium Console</title>
    <link rel="stylesheet" href="tester.css">
    <!-- Modern Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <div class="logo-icon"></div>
                    <h1>WMTP<span class="logo-accent">Hub</span></h1>
                </div>
                <p class="subtitle">Next-Gen Mail Protocol</p>

                <button id="theme-toggle" class="btn btn-ghost btn-sm"
                    style="margin-top: 16px; width: 100%; border-radius: 8px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right: 6px;">
                        <circle cx="12" cy="12" r="5" />
                        <path
                            d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
                    </svg>
                    <span id="theme-toggle-text">Light Mode</span>
                </button>

                <div class="status-card">
                    <div class="status-indicator">
                        <div id="status-dot" class="dot"></div>
                    </div>
                    <div class="status-details">
                        <span id="status-text" class="status-title">Connecting...</span>
                        <span id="session-email" class="status-session">No Session</span>
                    </div>
                </div>
            </div>

            <div class="cmd-list-container" id="sidebar-cmds">
                <!-- Dynamically populated via tester.js -->
            </div>
        </nav>

        <div class="resizer" id="resizer"></div>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Header for active command -->
            <header class="workspace-header">
                <div class="cmd-title-area">
                    <h2 id="active-cmd-name" class="cmd-title">INIT</h2>
                    <p class="cmd-desc">Configure command parameters and dispatch to the server.</p>
                </div>
            </header>

            <div class="workspace-content">
                <!-- Left: Form -->
                <div class="form-section">
                    <div class="panel glass-panel" id="form-panel">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- Right: Results -->
                <div class="results-section">
                    <div class="panel glass-panel results-panel" id="result-area">
                        <div class="panel-header">
                            <h3><span class="pulse-icon"></span> Live Stream</h3>
                            <button class="btn btn-sm btn-ghost"
                                onclick="document.getElementById('result-area').classList.remove('visible')">Clear
                                Log</button>
                        </div>
                        <div class="log-viewport">
                            <pre id="result-content" class="code-output"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Core Dependencies -->
    <script src="js/transport.js"></script>
    <script src="js/protocol.js"></script>
    <script src="js/schema.js"></script>
    <!-- Tester Logic -->
    <script src="tester.js"></script>

    <!-- Theme Toggle Logic -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeText = document.getElementById('theme-toggle-text');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            if (document.body.classList.contains('light-theme')) {
                themeText.innerText = 'Dark Mode';
            } else {
                themeText.innerText = 'Light Mode';
            }
        });
    </script>
</body>

</html>
