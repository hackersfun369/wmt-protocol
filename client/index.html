<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMTP Protocol Tester</title>
    <link rel="stylesheet" href="tester.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Left Sidebar: Command Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>WMTP Tester</h1>
            <p>Protocol Command Suite (57)</p>

            <div class="connection-status">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
            <div class="session-info">
                Active Session:<br>
                <strong id="session-email" style="color:#fff">No Session</strong>
            </div>
        </div>
        <div class="cmd-list" id="sidebar-cmds">
            <!-- Dynamically populated via tester.js -->
        </div>
    </div>

    <!-- Resizer Handle -->
    <div class="resizer" id="resizer"></div>

    <!-- Main Content Area -->
    <div class="main">
        <div class="active-cmd-header">
            <div>
                <h2 id="active-cmd-name">INIT</h2>
                <div class="active-cmd-desc">Configure command parameters and dispatch to the server.</div>
            </div>
        </div>

        <div class="work-area">
            <!-- Dynamic Form & Per-Command Results -->
            <div class="form-panel" id="form-panel">
                <!-- Dynamically populated via tester.js -->
            </div>
        </div>
    </div>

    <!-- Core Dependencies -->
    <script src="js/transport.js"></script>
    <script src="js/protocol.js"></script>
    <!-- Tester Logic -->
    <script src="tester.js"></script>

</body>

</html>
