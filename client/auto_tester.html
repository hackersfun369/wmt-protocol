<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WMTP Auto Tester</title>
    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #eee;
            padding: 20px;
        }

        button {
            font-size: 1.2em;
            padding: 10px 20px;
            cursor: pointer;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #status {
            margin: 20px 0;
            font-weight: bold;
            font-size: 1.2em;
        }

        #progress {
            margin-bottom: 20px;
            color: #aaa;
        }

        textarea {
            width: 100%;
            height: 600px;
            background: #222;
            color: #0f0;
            border: 1px solid #444;
            padding: 10px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>

<body>
    <h1>WMTP Automated Protocol Tester</h1>
    <div>
        <button id="runBtn">Run All 57 Tests</button>
        <span id="status">Ready</span>
    </div>
    <div id="progress"></div>
    <textarea id="results" placeholder="JSON Results will appear here..."></textarea>

    <!-- Dependencies -->
    <script src="js/transport.js"></script>
    <script src="js/protocol.js"></script>

    <!-- Test Logic -->
    <script src="js/auto_tester.js"></script>
</body>

</html>
